{% extends 'base.html' %}{% from 'macros.html' import operation,field %}{% block title %}Nuevo pedido{% endblock %}
{% block content %}<p class="lead-note">Guardar valida existencias. El stock se descuenta al preparar.</p><form method="post" id="order-form" class="panel">{{ operation() }}<div class="form-grid"><div class="field"><label for="cliente_id">Cliente activo</label><select class="form-select" id="cliente_id" name="cliente_id" required><option value="">Seleccionar cliente</option>{% for c in clients %}<option value="{{ c.id }}">{{ c.nombre_comercio }}</option>{% endfor %}</select></div>{{ field('vendedor','Vendedor') }}</div>
<div id="items"><div class="order-item"><div class="field"><label for="producto_0">Producto</label><select id="producto_0" name="producto_id" class="form-select item-product" required><option value="" data-price="0">Seleccionar producto</option>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.precio_unitario }}">{{ p.codigo }} · {{ p.nombre }} · stock {{ p.cantidad_actual }} · {{ p.precio_unitario|gs }}</option>{% endfor %}</select></div><div class="field"><label for="cantidad_0">Cantidad solicitada</label><input id="cantidad_0" name="cantidad" class="form-control item-qty" type="number" min="1" max="1000000" step="1" value="1" required></div><output class="subtotal">Gs. 0</output><button type="button" class="btn btn-outline-secondary remove-item" aria-label="Quitar producto">Quitar</button></div></div>
<button type="button" id="add-item" class="btn btn-outline-secondary">+ Agregar producto</button><div class="total"><span>Monto solicitado</span><output id="order-total" aria-live="polite">Gs. 0</output></div><div class="field"><label for="observaciones">Observaciones</label><textarea id="observaciones" name="observaciones" maxlength="2000" class="form-control"></textarea></div><button class="btn btn-primary">Guardar pedido</button></form>{% endblock %}
